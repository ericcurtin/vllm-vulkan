# SPDX-License-Identifier: Apache-2.0
[package]
name = "vllm-vulkan"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "High-performance Rust extension for vLLM Vulkan"

[lib]
name = "_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.24", features = ["extension-module"] }
parking_lot = "0.12"
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
