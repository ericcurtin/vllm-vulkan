name: Build and Release

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        # No job needs git credentials after checkout, so do not leave the
        # job's GITHUB_TOKEN in .git/config for later build steps to read.
        persist-credentials: false

    - name: Build wheel
      run: ./scripts/build.sh

    - name: Upload wheel artifact
      uses: actions/upload-artifact@v4
      with:
        name: wheel-${{ matrix.os }}
        path: dist/*.whl

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        # Safe even though this job publishes a release: scripts/release.sh
        # reaches GitHub through `gh release create`, which uses the GH_TOKEN
        # env var and the REST API — it never pushes or tags over git, and its
        # only git call is a local `git rev-parse HEAD`.
        persist-credentials: false

    - name: Download all wheel artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: wheel-*
        path: dist
        merge-multiple: true

    - name: Create GitHub release
      run: ./scripts/release.sh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
