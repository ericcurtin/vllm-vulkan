name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [macos-15, ubuntu-24.04-arm, ubuntu-24.04]

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        submodules: recursive
        # No job needs git credentials after checkout, so do not leave the
        # job's GITHUB_TOKEN in .git/config where the shader compiler and
        # cargo build scripts this job runs could read it.
        persist-credentials: false

    - name: Lint
      run: |
        scripts/lint.sh

  test:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [macos-15, ubuntu-24.04, ubuntu-24.04-arm]

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        submodules: recursive
        # No job needs git credentials after checkout, so do not leave the
        # job's GITHUB_TOKEN in .git/config where the shader compiler and
        # cargo build scripts this job runs could read it.
        persist-credentials: false

    - name: Cache HuggingFace models
      uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface/hub
        key: hf-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/test.sh') }}

    - name: Test
      run: |
        scripts/test.sh

  # Type-check the crate (including its #[cfg(test)] modules) under the model-free
  # foundation feature slice. scripts/test.sh only runs pytest, so cargo never
  # exercised the Rust test code in CI — which let #[cfg(test)] modules that
  # reference model-gated symbols break `cargo test
  # --no-default-features --features multiple-pymethods` invisibly. Running the
  # foundation-slice unit tests here catches that (and any other) Rust-test
  # regression. The slice is deterministic on CI: no GPU (those tests are
  # #[ignore]) and no env-sensitive tests (they are gated to model features).
  rust-test-foundation:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        submodules: recursive
        # No job needs git credentials after checkout, so do not leave the
        # job's GITHUB_TOKEN in .git/config where the shader compiler and
        # cargo build scripts this job runs could read it.
        persist-credentials: false

    - name: Install build + link deps
      run: |
        # glslang: build.rs runs scripts/compile_shaders.sh (ensure_vulkan is the
        # project's own installer, same path scripts/test.sh uses).
        # libvulkan-dev: the linker needs libvulkan.so (build.rs links -lvulkan).
        # libpython3.12-dev: pyo3 links -lpython3.12 for the test binary.
        source scripts/lib.sh
        ensure_vulkan
        sudo apt-get install -y libvulkan-dev libpython3.12-dev

    - name: Run foundation-slice Rust tests
      run: |
        # The test binary embeds the interpreter; point it at the system Python.
        # `export VAR=$(cmd)` MASKS a failing lookup: `export`'s own exit status
        # is 0, so `bash -e` does not stop and the job runs with an EMPTY
        # PYTHONHOME. The symptom is `ModuleNotFoundError: No module named
        # 'encodings'` from the embedded interpreter, which reads as a test
        # failure rather than a missing python3.12. Assign, check, then export.
        PYTHONHOME="$(python3.12 -c 'import sys; print(sys.base_prefix)')"
        test -n "$PYTHONHOME" || { echo "python3.12 reported no base_prefix" >&2; exit 1; }
        export PYTHONHOME
        cargo test --no-default-features --features "multiple-pymethods" --lib

    # lavapipe is Mesa's CPU Vulkan driver. With it selected the kernel
    # conformance tests stop no-op'ing and actually dispatch the compiled
    # SPIR-V, checking each quantized matvec against a CPU reference. The
    # device-less run above stays as-is: it is what proves the graceful-skip
    # path still works.
    - name: Install Mesa lavapipe (software Vulkan device)
      run: |
        sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
        # The lavapipe ICD filename varies with Mesa packaging -- noble ships
        # lvp_icd.x86_64.json while noble-updates ships lvp_icd.json -- and the
        # directory differs across distros too. Discover it instead of pinning
        # one spelling, and fail loudly (listing what IS installed) if absent,
        # so this never degrades into a silently device-less run.
        icd=$(find /usr/share/vulkan/icd.d /usr/lib/x86_64-linux-gnu/vulkan/icd.d \
                -name 'lvp_icd*.json' 2>/dev/null | head -1)
        if [ -z "$icd" ]; then
          echo "::error::lavapipe ICD not found. Installed Vulkan ICDs:"
          find /usr -name '*_icd*.json' 2>/dev/null | sed 's/^/  /'
          exit 1
        fi
        echo "lavapipe ICD: $icd"
        echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
        VK_ICD_FILENAMES="$icd" vulkaninfo --summary | head -40

    - name: Run Rust tests against the software Vulkan device
      env:
        RUST_BACKTRACE: '1'
      run: |
        # VK_ICD_FILENAMES comes from the discovery step above via GITHUB_ENV.
        PYTHONHOME="$(python3.12 -c 'import sys; print(sys.base_prefix)')"
        test -n "$PYTHONHOME" || { echo "python3.12 reported no base_prefix" >&2; exit 1; }
        export PYTHONHOME
        cargo test --no-default-features --features "multiple-pymethods" --lib -- --nocapture

    # Structural validation of every compiled module. Complements the Rust
    # reflection gates: spirv-val checks the module against the SPIR-V spec,
    # while the reflection tests check it against the Rust dispatch contract
    # (bindings, push-constant sizes) -- which spirv-val does not look at.
    # The target-env must track scripts/compile_shaders.sh's --target-env.
    - name: Validate compiled SPIR-V modules
      run: |
        set -euo pipefail
        sudo apt-get install -y spirv-tools
        mapfile -t mods < <(find target -type d -name spirv -path '*/vllm-vulkan-*/out/*' -exec find {} -name '*.spv' \;)
        if [ "${#mods[@]}" -eq 0 ]; then
          echo "::error::no compiled .spv modules found - did the build step run?"
          exit 1
        fi
        fail=0
        for m in "${mods[@]}"; do
          if ! out=$(spirv-val --target-env vulkan1.3 "$m" 2>&1); then
            echo "::error file=$m::spirv-val failed: $out"
            fail=$((fail + 1))
          fi
        done
        echo "spirv-val: ${#mods[@]} module(s) checked, $fail failure(s)"
        [ "$fail" -eq 0 ]

  # Run the Rust tests of the `gemma` model slice — the ~11.8k lines this
  # branch adds. `rust-test-foundation` above runs
  # `--no-default-features --features multiple-pymethods`, which compiles NONE
  # of the gemma/qwen3-dense code, so every `#[cfg(test)]` module in
  # gemma_forward / gemma_assistant / gemma_spec / unified_layer /
  # batched_forward / pyseam_gemma was invisible to CI: green did not mean
  # tested. As of this branch the foundation slice runs 134 tests and the gemma
  # slice 178, so 44 tests run only here.
  #
  # Five of those are the checkpoint-free gemma_assistant gates. The EAGLE
  # drafter's golden tests need a 939MB checkpoint via
  # VLLM_TEST_GEMMA31B_ASSISTANT_DIR and print SKIP without it, which in CI is
  # always -- so the whole drafter path was green-but-unrun. The synthetic
  # fixture in `gemma_assistant.rs` is the unconditional twin; it must stay
  # ungated by any env var or feature this job does not set.
  #
  # This also builds the standalone configuration the PR advertises
  # (`--features multiple-pymethods,gemma`, i.e. gemma WITHOUT qwen35), which
  # is where a model feature that silently depends on a sibling feature shows
  # up as a compile error instead of as a silently-disengaged runtime lever.
  rust-test-gemma:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        submodules: recursive
        # No job needs git credentials after checkout, so do not leave the
        # job's GITHUB_TOKEN in .git/config where the shader compiler and
        # cargo build scripts this job runs could read it.
        persist-credentials: false

    - name: Install build + link deps
      run: |
        # Same deps as rust-test-foundation: glslang via the project's own
        # installer (build.rs runs scripts/compile_shaders.sh), libvulkan for
        # the -lvulkan link, libpython for the pyo3 test binary.
        source scripts/lib.sh
        ensure_vulkan
        sudo apt-get install -y libvulkan-dev libpython3.12-dev

    - name: Build the standalone gemma slice
      run: |
        # The PR's own stated claim. Keeping it in CI is what stops `gemma`
        # from quietly acquiring a `qwen35` dependency.
        cargo build --no-default-features --features "multiple-pymethods,gemma"

    - name: Run gemma-slice Rust tests
      env:
        RUST_BACKTRACE: '1'
      run: |
        # The test binary embeds the interpreter; point it at the system Python.
        PYTHONHOME="$(python3.12 -c 'import sys; print(sys.base_prefix)')"
        test -n "$PYTHONHOME" || { echo "python3.12 reported no base_prefix" >&2; exit 1; }
        export PYTHONHOME
        # Single-threaded: two GEMM-picker tests race on a process-global
        # env/OnceLock snapshot under the parallel runner.
        cargo test --no-default-features --features "multiple-pymethods,gemma" --lib \
          -- --test-threads=1 --nocapture

  # The qwen35 slice. `rust-test-gemma` above cannot cover it: the
  # `push_constants::dispatch_tests` module is `#[cfg(all(test, feature =
  # "qwen35"))]`, so ~70 dispatch/picker tests — the matvec kernel-routing
  # contract — compile out of every job that does not enable `qwen35`. This
  # job is what executes them.
  #
  # It builds the stacked configuration the PR advertises (gemma + qwen35),
  # because `qwen35` stacks on `model-gemma` and must not regress it.
  rust-test-qwen35:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        submodules: recursive
        # No job needs git credentials after checkout, so do not leave the
        # job's GITHUB_TOKEN in .git/config where the shader compiler and
        # cargo build scripts this job runs could read it.
        persist-credentials: false

    - name: Install build + link deps
      run: |
        # Same deps as rust-test-foundation: glslang via the project's own
        # installer (build.rs runs scripts/compile_shaders.sh), libvulkan for
        # the -lvulkan link, libpython for the pyo3 test binary.
        source scripts/lib.sh
        ensure_vulkan
        sudo apt-get install -y libvulkan-dev libpython3.12-dev

    - name: Build the stacked gemma+qwen35 slice
      run: |
        cargo build --no-default-features --features "multiple-pymethods,gemma,qwen35"

    - name: Run qwen35-slice Rust tests
      env:
        RUST_BACKTRACE: '1'
      run: |
        # The test binary embeds the interpreter; point it at the system Python.
        PYTHONHOME="$(python3.12 -c 'import sys; print(sys.base_prefix)')"
        test -n "$PYTHONHOME" || { echo "python3.12 reported no base_prefix" >&2; exit 1; }
        export PYTHONHOME
        # Single-threaded: two GEMM-picker tests race on a process-global
        # env/OnceLock snapshot under the parallel runner.
        cargo test --no-default-features --features "multiple-pymethods,gemma,qwen35" --lib \
          -- --test-threads=1 --nocapture

    # `mtp` ships in `default` (Cargo.toml), but every job above runs
    # `--no-default-features`, so `src/mtp.rs` did not COMPILE anywhere in CI —
    # its `#[cfg(test)]` parity gates included. `mtp` stacks on `qwen35`
    # (the feature edge), so this is its cheapest home. Kept as a SEPARATE
    # step rather than folded into the feature list above, so the stacked
    # gemma+qwen35 configuration this PR advertises still gets built and
    # tested on its own.
    - name: Run the qwen35+mtp slice (adds src/mtp.rs and its parity gates)
      env:
        RUST_BACKTRACE: '1'
      run: |
        PYTHONHOME="$(python3.12 -c 'import sys; print(sys.base_prefix)')"
        test -n "$PYTHONHOME" || { echo "python3.12 reported no base_prefix" >&2; exit 1; }
        export PYTHONHOME
        cargo test --no-default-features --features "multiple-pymethods,gemma,qwen35,mtp" --lib \
          -- --test-threads=1 --nocapture
